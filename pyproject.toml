[project]
name = "homeassistant-trinity"
version = "1.10.1"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter
    "RUF012", # mutable class attributes are idiomatic in HA entities
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.trinity"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
include = ["custom_components/trinity"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
reportGeneralTypeIssues = "warning"
reportCallIssue = "warning"
